<!DOCTYPE html>
<html lang="cs">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 40px;
            border-bottom: 2px solid #ff9500;
        }
        
        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: -1px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        
        .subtitle {
            font-size: 0.95rem;
            color: #666;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        
        .content {
            margin-bottom: 60px;
        }
        
        h2 {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 25px;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
        }
        
        th {
            background-color: #ff9500;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        tr:hover {
            background-color: #fff9f3;
        }
        
        footer {
            text-align: center;
            padding-top: 40px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 0.9rem;
        }
        
        .badge {
            display: inline-block;
            background-color: #ffe4cc;
            color: #d97706;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>

                    </tr>
                    <tr>
                        <td><strong>grync.fun</strong></td>

                    </tr>
                    <tr>
                        <td><strong>Projekt 3</strong></td>
                        <td>V přípravě...</td>
                        <td><span class="badge" style="background-color: #dbeafe; color: #0284c7;">Soon</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <footer>
            <p>Hosted on <a href="https://pages.github.com" style="color: #ff9500; text-decoration: none; font-weight: 500;">GitHub Pages</a></p>
